name: Terraform Apply

# -----------------------------------------------------------------------------
# The only thing that touches a customer tenant. Triggered by a merge, never by
# a person running terraform on a laptop.
#
# Same detect-then-matrix shape as plan.yaml, and for the same reason: each
# customer applies with only its own credentials, against only its own state.
#
# Deliberately absent: a chat notification step. The production version of this
# pipeline posts to Slack after every apply, but a webhook, channel and message
# format are the most organisation-specific part of any pipeline. What is left
# is the GitHub-native equivalent — a run summary — plus a marked place to add
# your own. See README "Notifications".
# -----------------------------------------------------------------------------

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'customers/**'
      - 'modules/**'

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      customers: ${{ steps.find.outputs.customers }}
    steps:
      - name: Checkout code
        # fetch-depth: 0 — the diff below compares two commits, which needs
        # full history. A shallow clone makes `git diff` fail here.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find affected customers
        id: find
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})

          HEAD_BRANCH="${{ github.ref_name }}"

          if [ "$HEAD_BRANCH" = "staging" ]; then
            CUSTOMERS="staging"
          else
            if echo "$CHANGED" | grep -q '^modules/'; then
              # Shared module change: apply to every tenant.
              CUSTOMERS=$(ls -d customers/*/ | grep -v '_template' | xargs -n1 basename)
            else
              CUSTOMERS=$(echo "$CHANGED" | grep '^customers/' | grep -v '_template' | cut -d/ -f2 | sort -u || true)
            fi
          fi

          # Drop customers whose directories no longer exist (offboarding).
          CUSTOMERS=$(echo "$CUSTOMERS" | while read -r c; do [ -d "customers/$c" ] && echo "$c" || true; done)

          JSON=$(echo "$CUSTOMERS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "customers=${JSON}" >> "$GITHUB_OUTPUT"
          echo "Applying to: ${JSON}"

  apply:
    needs: detect
    if: needs.detect.outputs.customers != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        customer: ${{ fromJSON(needs.detect.outputs.customers) }}
    environment:
      # Credential isolation, and also where you attach a GitHub Environment
      # protection rule (required reviewers, wait timer) if you want a second
      # gate in front of production applies.
      name: ${{ matrix.customer }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform init
        working-directory: customers/${{ matrix.customer }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color -parallelism=1
        working-directory: customers/${{ matrix.customer }}
        env:
          TF_VAR_protect_url: ${{ vars.PROTECT_URL }}
          TF_VAR_protect_client_id: ${{ secrets.PROTECT_CLIENT_ID }}
          TF_VAR_protect_client_password: ${{ secrets.PROTECT_CLIENT_PASSWORD }}
          TF_VAR_jpro_url: ${{ secrets.JPRO_URL }}
          TF_VAR_jpro_client_id: ${{ secrets.JPRO_CLIENT_ID }}
          TF_VAR_jpro_client_secret: ${{ secrets.JPRO_CLIENT_SECRET }}
          TF_VAR_sentinel_app_secret: ${{ secrets.SENTINEL_APP_SECRET }}

      - name: Write reporting integration credentials to run summary
        # -------------------------------------------------------------------
        # Terraform generates the reporting integration client password, and
        # the reporting product has no API to receive it, so a human has to
        # copy it across once. This step surfaces it.
        #
        # UNDERSTAND WHAT THIS DOES BEFORE YOU KEEP IT. It writes a live
        # credential into the workflow run summary, where anyone with read
        # access to the repository can see it for as long as the run is
        # retained. That is an accepted, time-boxed trade in our service; it
        # may not be acceptable in yours.
        #
        # If you keep it: shorten the repository's workflow retention period
        # (Settings > Actions > General), keep repo read access tight, and
        # rotate the credential if it is ever seen by someone who should not
        # have. If you would rather not: delete this step and read the value
        # with `terraform output -raw insights_api_client_secret` from a
        # trusted machine instead.
        # -------------------------------------------------------------------
        if: success()
        run: |
          SECRET=$(terraform output -raw insights_api_client_secret)
          ID=$(terraform output -raw insights_api_client_id)
          {
            echo "## Reporting integration credentials — ${{ matrix.customer }}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Protect URL | \`${{ vars.PROTECT_URL }}\` |"
            echo "| Client ID | \`${ID}\` |"
            echo "| Client Secret | \`${SECRET}\` |"
            echo ""
            echo "Enter these into the reporting product, then treat this run summary as spent."
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: customers/${{ matrix.customer }}

      - name: Record outcome in run summary
        if: always()
        run: |
          {
            echo "## Apply — ${{ matrix.customer }}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Customer | \`${{ matrix.customer }}\` |"
            echo "| Result | ${{ job.status }} |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Triggered by | @${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # --- Notifications ------------------------------------------------------
      # Add your own outbound notification here if you want one — Slack, Teams,
      # email, a ticketing system. The pattern is a single `if: always()` step
      # at the end of the job reading `job.status`, `matrix.customer` and the
      # run URL. See README "Notifications" for a worked example.
