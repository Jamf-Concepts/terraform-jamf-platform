name: Drift Detection

# -----------------------------------------------------------------------------
# Answers the question "does the live environment still match the code?" for
# every customer, on a schedule, without anyone remembering to ask.
#
# The mechanism is one flag: `terraform plan -detailed-exitcode`.
#   exit 0 — no changes. Reality matches the code.
#   exit 2 — changes present. Something was altered outside Terraform.
#   exit 1 — the plan itself failed. That is an error, not drift.
#
# Drift is reported, never auto-corrected. A finding opens (or updates) a GitHub
# issue and stops there. Deciding whether a change should exist is a human
# judgement: if it should, it goes into the code through a reviewed pull
# request; if it should not, remediate.yaml reverts it. See remediate.yaml.
#
# `staging` is excluded — it is expected to be ahead of main during
# development, so drift there is normal rather than a signal.
# -----------------------------------------------------------------------------

on:
  schedule:
    # Monday 06:00 UTC — findings are waiting at the start of the week.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      customers: ${{ steps.find.outputs.customers }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Find all customer directories
        id: find
        run: |
          CUSTOMERS=$(
            # Glob rather than `ls | grep`: no ls output to parse, and safe for any
            # directory name.
            for dir in customers/*/; do
              name="$(basename "$dir")"
              if [ "$name" = "_template" ]; then continue; fi
              if [ "$name" = "staging" ]; then continue; fi
              echo "$name"
            done
          )
          JSON=$(echo "$CUSTOMERS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "customers=${JSON}" >> "$GITHUB_OUTPUT"
          echo "Discovered customers: ${JSON}"

  plan:
    needs: discover
    if: needs.discover.outputs.customers != '[]'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        customer: ${{ fromJSON(needs.discover.outputs.customers) }}
    environment:
      name: ${{ matrix.customer }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Terraform
        # terraform_wrapper: false — the setup action's default wrapper script
        # swallows the process exit code, which is the entire signal this
        # workflow depends on.
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform init
        working-directory: customers/${{ matrix.customer }}

      - name: Terraform Plan
        id: plan
        run: |
          # `set +e` around the plan so a non-zero exit is inspected rather than
          # ending the step. Exit code 2 means drift, which is a normal outcome
          # for this workflow, not a failure.
          set +e
          terraform plan -detailed-exitcode -no-color -parallelism=1 > plan_output.txt 2>&1
          EXIT_CODE=$?
          set -e
          cat plan_output.txt

          if [ $EXIT_CODE -eq 0 ]; then
            echo "No drift detected for ${{ matrix.customer }}"
            echo "drift=false" >> "$GITHUB_OUTPUT"
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "Drift detected for ${{ matrix.customer }}"
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "Terraform plan failed for ${{ matrix.customer }} — this is an error, not drift"
            exit 1
          fi
        working-directory: customers/${{ matrix.customer }}
        env:
          TF_VAR_protect_url: ${{ vars.PROTECT_URL }}
          TF_VAR_protect_client_id: ${{ secrets.PROTECT_CLIENT_ID }}
          TF_VAR_protect_client_password: ${{ secrets.PROTECT_CLIENT_PASSWORD }}
          TF_VAR_jpro_url: ${{ secrets.JPRO_URL }}
          TF_VAR_jpro_client_id: ${{ secrets.JPRO_CLIENT_ID }}
          TF_VAR_jpro_client_secret: ${{ secrets.JPRO_CLIENT_SECRET }}
          TF_VAR_sentinel_app_secret: ${{ secrets.SENTINEL_APP_SECRET }}

      - name: Check for existing drift issue
        # One issue per customer, updated on subsequent runs. Without this, a
        # customer with unresolved drift accumulates a new issue every week and
        # the signal drowns.
        id: check-issue
        if: steps.plan.outputs.drift == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['drift detected'],
              per_page: 100
            });

            const title = `Drift detected: ${{ matrix.customer }}`;
            const existing = issues.data.find(issue => issue.title === title);

            if (existing) {
              core.setOutput('issue-number', String(existing.number));
              core.setOutput('issue-url', existing.html_url);
              core.setOutput('issue-exists', 'true');
            } else {
              core.setOutput('issue-exists', 'false');
            }

      - name: Create new drift issue
        id: create-issue
        if: steps.plan.outputs.drift == 'true' && steps.check-issue.outputs.issue-exists == 'false'
        uses: actions/github-script@v9
        env:
          # Optional comma-separated GitHub usernames to assign drift issues to.
          # Set as a repository variable. Unset means nobody is assigned, and
          # the issue relies on repository notifications instead.
          ASSIGNEES: ${{ vars.DRIFT_ISSUE_ASSIGNEES }}
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync(
              `customers/${{ matrix.customer }}/plan_output.txt`, 'utf8'
            );
            // GitHub issue bodies cap at 65536 characters; a large plan will
            // exceed it and the API call would fail outright.
            const maxLen = 60000;
            const truncated = planOutput.length > maxLen
              ? planOutput.substring(0, maxLen) + '\n\n... (truncated)'
              : planOutput;

            const assignees = (process.env.ASSIGNEES || '')
              .split(',')
              .map(s => s.trim())
              .filter(Boolean);

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              // The title format matters: remediate.yaml parses the customer
              // name back out of it. Change one, change both.
              title: `Drift detected: ${{ matrix.customer }}`,
              body: `## Drift detected for \`${{ matrix.customer }}\`\n\n` +
                    `The live Jamf Protect tenant no longer matches this repository.\n\n` +
                    `**Decide before acting.** If the change should exist, add it to the code through a pull request. ` +
                    `If it should not, apply the \`auto-remediate\` label to revert it.\n\n` +
                    `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                    `<details><summary>Terraform Plan Output</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n\n</details>`,
              labels: ['drift detected'],
              ...(assignees.length ? { assignees } : {})
            });
            core.setOutput('issue-url', issue.data.html_url);

      - name: Comment on existing drift issue
        if: steps.plan.outputs.drift == 'true' && steps.check-issue.outputs.issue-exists == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync(
              `customers/${{ matrix.customer }}/plan_output.txt`, 'utf8'
            );
            const maxLen = 60000;
            const truncated = planOutput.length > maxLen
              ? planOutput.substring(0, maxLen) + '\n\n... (truncated)'
              : planOutput;

            const now = new Date().toISOString();

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(${{ steps.check-issue.outputs.issue-number }}),
              body: `## :repeat: Drift still present — ${now}\n\n` +
                    `This is a subsequent detection run, not a new drift event.\n\n` +
                    `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                    `<details><summary>Terraform Plan Output</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n\n</details>`
            });

      - name: Record outcome in run summary
        if: always()
        run: |
          {
            echo "## Drift detection — ${{ matrix.customer }}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Customer | \`${{ matrix.customer }}\` |"
            echo "| Drift | ${{ steps.plan.outputs.drift || 'unknown' }} |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # --- Notifications ------------------------------------------------------
      # A drift finding is the single most useful thing in this pipeline to push
      # somewhere people actually look. Add your own step here — the issue URL
      # is available as steps.create-issue.outputs.issue-url (new) or
      # steps.check-issue.outputs.issue-url (recurring). See README
      # "Notifications".
